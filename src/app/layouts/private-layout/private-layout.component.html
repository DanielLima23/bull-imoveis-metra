<div class="private-layout" [class.nav-open]="isMobileOpen()" [class.collapsed]="isCollapsed()">
  <button class="overlay" type="button" (click)="closeMobileMenu()" aria-label="Fechar menu"></button>

  <aside class="sidenav">
    <div class="sidenav__brand">
      <button class="brand" type="button" (click)="onBrandClick()">
        <span class="brand__mark">{{ brandShortName() }}</span>
        <span class="brand__copy">
          <strong>{{ brandName() }}</strong>
          <small>Painel de gestão imobiliária</small>
        </span>
      </button>
    </div>

    <button class="sidenav__toggle"
            type="button"
            (click)="toggleSidebar()"
            [attr.aria-label]="isCollapsed() ? 'Expandir menu' : 'Colapsar menu'"
            [attr.aria-expanded]="!isCollapsed()">
      <svg viewBox="0 0 24 24" class="icon-svg toggle-icon">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <nav class="nav" aria-label="Menu principal">
      @for (group of menuGroups(); track group.label) {
        <section class="nav-group">
          <div class="nav-group__title">
            <span class="nav-group__icon" aria-hidden="true" [attr.title]="isCollapsed() ? group.label : null">
              <svg viewBox="0 0 24 24" class="icon-svg">
                @switch (group.icon) {
                  @case ('painel') {
                    <rect x="3" y="3" width="7" height="7" rx="1.5" />
                    <rect x="14" y="3" width="7" height="4" rx="1.5" />
                    <rect x="14" y="9" width="7" height="12" rx="1.5" />
                    <rect x="3" y="12" width="7" height="9" rx="1.5" />
                  }
                  @case ('cadastros') {
                    <path d="M4 6h16" />
                    <path d="M4 12h16" />
                    <path d="M4 18h10" />
                  }
                  @case ('operacoes') {
                    <path d="M6 6h12l-1 5H7z" />
                    <path d="M7 14h10" />
                    <path d="M9 18h6" />
                  }
                  @case ('relatorios') {
                    <path d="M6 3h9l4 4v14H6z" />
                    <path d="M15 3v5h5" />
                    <path d="M9 13h6" />
                    <path d="M9 17h6" />
                  }
                  @case ('configuracoes') {
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1.8 1.8 0 1 1-2.6 2.6l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a1.8 1.8 0 1 1-3.6 0v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a1.8 1.8 0 1 1-2.6-2.6l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a1.8 1.8 0 1 1 0-3.6h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a1.8 1.8 0 1 1 2.6-2.6l.1.1a1 1 0 0 0 1.1.2h.1a1 1 0 0 0 .6-.9V4a1.8 1.8 0 1 1 3.6 0v.2a1 1 0 0 0 .6.9h.1a1 1 0 0 0 1.1-.2l.1-.1a1.8 1.8 0 1 1 2.6 2.6l-.1.1a1 1 0 0 0-.2 1.1v.1a1 1 0 0 0 .9.6H20a1.8 1.8 0 1 1 0 3.6h-.2a1 1 0 0 0-.9.6z" />
                  }
                }
              </svg>
            </span>
            <span>{{ group.label }}</span>
          </div>

          <div class="nav-group__items">
            @for (item of group.items; track item.route) {
              <a [routerLink]="item.route" routerLinkActive="active" (click)="onMenuItemClick()"
                 [attr.title]="isCollapsed() ? item.label : null">
                <span class="item-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" class="icon-svg">
                    @switch (item.icon) {
                      @case ('dashboard') {
                        <rect x="3" y="3" width="8" height="8" rx="1.5" />
                        <rect x="13" y="3" width="8" height="5" rx="1.5" />
                        <rect x="3" y="13" width="8" height="8" rx="1.5" />
                        <rect x="13" y="10" width="8" height="11" rx="1.5" />
                      }
                      @case ('building') {
                        <path d="M3 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16" />
                        <path d="M13 10h6a2 2 0 0 1 2 2v9" />
                        <path d="M3 21h18" />
                        <path d="M7 8h2" /><path d="M7 12h2" /><path d="M7 16h2" />
                        <path d="M15 14h2" /><path d="M15 18h2" />
                      }
                      @case ('user-check') {
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <polyline points="16 11 18 13 22 9" />
                      }
                      @case ('users') {
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                      }
                      @case ('key') {
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
                      }
                      @case ('wallet') {
                        <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4" />
                        <path d="M4 6v12a2 2 0 0 0 2 2h14v-4" />
                        <path d="M18 12a2 2 0 0 0 0 4h4v-4z" />
                      }
                      @case ('alert-circle') {
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                      }
                      @case ('calendar') {
                        <rect x="3" y="4" width="18" height="18" rx="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                      }
                      @case ('wrench') {
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                      }
                      @case ('bar-chart') {
                        <line x1="12" y1="20" x2="12" y2="10" />
                        <line x1="18" y1="20" x2="18" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="16" />
                      }
                      @case ('sliders') {
                        <line x1="4" y1="21" x2="4" y2="14" />
                        <line x1="4" y1="10" x2="4" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="12" />
                        <line x1="12" y1="8" x2="12" y2="3" />
                        <line x1="20" y1="21" x2="20" y2="16" />
                        <line x1="20" y1="12" x2="20" y2="3" />
                        <line x1="1" y1="14" x2="7" y2="14" />
                        <line x1="9" y1="8" x2="15" y2="8" />
                        <line x1="17" y1="16" x2="23" y2="16" />
                      }
                    }
                  </svg>
                </span>
                <span class="item-label">{{ item.label }}</span>
              </a>
            }
          </div>
        </section>
      }
    </nav>

    <div class="sidenav__footer">
      @if (user(); as currentUser) {
        <div class="sidenav-user">
          <strong>{{ currentUser.name }}</strong>
          <span>{{ currentUser.role }}</span>
        </div>
      }

      <button type="button" class="btn btn-secondary sidenav__logout" (click)="logout()">
        <svg viewBox="0 0 24 24" class="icon-svg logout-icon" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="logout-label">Sair</span>
      </button>
    </div>
  </aside>

  <section class="workspace">
    <div class="workspace__mobile-actions">
        <button type="button" class="menu-btn btn btn-secondary" (click)="toggleMobileMenu()">Menu</button>
    </div>

    <main class="content">
      <router-outlet />
    </main>
  </section>
</div>
